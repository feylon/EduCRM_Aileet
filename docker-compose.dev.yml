# Development override with hot reload:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Frontend (Vite): http://localhost:5173   API: http://localhost:3000/api
services:
  postgres:
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

  backend:
    build:
      target: development
    image: educrm-backend:dev
    environment:
      NODE_ENV: development
    command: ["sh", "-c", "npm run seed && npm run start:dev"]
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

  frontend:
    build:
      target: development
    image: educrm-frontend:dev
    environment:
      VITE_PROXY_TARGET: http://backend:3000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"

volumes:
  backend_node_modules:
  frontend_node_modules:
